name: NutShell cache open-source DV

on:
  push:
    paths:
      - "workspace/nutshell_cache/**"
      - ".github/workflows/nutshell-cache-dv.yml"
  pull_request:
    paths:
      - "workspace/nutshell_cache/**"
      - ".github/workflows/nutshell-cache-dv.yml"
  workflow_dispatch:

jobs:
  cache-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up RTL and formal tools
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: "2026-10-21"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install open-source RTL toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git lcov libboost-all-dev \
            libffi-dev liblz4-dev libyaml-cpp-dev pkg-config python3-dev python3-venv \
            swig zlib1g-dev
      - name: Create Python environment
        run: |
          python3 -m venv .tooling/venv
          source .tooling/venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r workspace/nutshell_cache/requirements-dv.txt
      - name: Build pinned Picker open-source RTL bridge
        run: |
          git clone --filter=blob:none https://github.com/XS-MLVP/picker.git .tooling/picker
          git -C .tooling/picker checkout c100874936aad4030d3bc4c8425ab652f2fbc7ad
          make -C .tooling/picker init
          # Picker's init script shallow-clones xcomm's default branch. Fetch
          # the pinned historical commit explicitly before checking it out.
          git -C .tooling/picker/dependence/xcomm fetch --depth=1 origin 23ba5c47310a74dab1567a4ca54ad85dec4512cb
          git -C .tooling/picker/dependence/xcomm checkout 23ba5c47310a74dab1567a4ca54ad85dec4512cb
          source .tooling/venv/bin/activate
          make -C .tooling/picker install \
            ARGS="-DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/.tooling/picker-install"
      - name: Install pinned SymbiYosys frontend
        run: |
          git clone --filter=blob:none https://github.com/YosysHQ/sby.git .tooling/sby-source
          git -C .tooling/sby-source checkout b1a1e98cba941ec8433f8dc27f416cd7bb7f14be
          make -C .tooling/sby-source install \
            PREFIX="$GITHUB_WORKSPACE/.tooling/sby-install"
      - name: Check installed open-source toolchain
        working-directory: workspace/nutshell_cache
        run: |
          source scripts/env.sh
          picker --version
          yosys --version
          sby --version
      - name: Generate DUT
        working-directory: workspace/nutshell_cache
        run: make gen_dut
      - name: Run formal proofs
        working-directory: workspace/nutshell_cache
        run: make formal
      - name: Run regression and coverage closure
        working-directory: workspace/nutshell_cache
        env:
          NUTSHELL_RANDOM_SEEDS: "0x2468ACE,0xFACE1234"
        run: make report
      - name: Upload regression and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nutshell-cache-dv-reports
          path: workspace/nutshell_cache/reports/
          if-no-files-found: warn

  coherence-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up RTL and formal tools
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: "2026-10-21"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git lcov libboost-all-dev \
            libffi-dev liblz4-dev libyaml-cpp-dev pkg-config python3-dev python3-venv \
            swig zlib1g-dev
      - name: Create project Python environment
        run: |
          python3 -m venv .tooling/venv
          source .tooling/venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r workspace/nutshell_cache/requirements-dv.txt
      - name: Build pinned Picker open-source RTL bridge
        run: |
          git clone --filter=blob:none https://github.com/XS-MLVP/picker.git .tooling/picker
          git -C .tooling/picker checkout c100874936aad4030d3bc4c8425ab652f2fbc7ad
          make -C .tooling/picker init
          # Picker init clones xcomm's default branch; restore the validated pin.
          git -C .tooling/picker/dependence/xcomm fetch --depth=1 origin 23ba5c47310a74dab1567a4ca54ad85dec4512cb
          git -C .tooling/picker/dependence/xcomm checkout 23ba5c47310a74dab1567a4ca54ad85dec4512cb
          source .tooling/venv/bin/activate
          make -C .tooling/picker install \
            ARGS="-DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/.tooling/picker-install"
      - name: Run coherence module, formal, and subsystem regressions
        run: make -C workspace/nutshell_cache COHERENCE_JOBS=1 coherence_verify
      - name: Upload coherence verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cache-coherence-verification
          path: |
            workspace/nutshell_cache/reports/coherence/
            workspace/nutshell_cache/reports/formal/
          if-no-files-found: warn
